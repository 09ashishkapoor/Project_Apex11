name: Build and deploy Mantrini

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mantrini-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  credentials:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check deployment credential
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo '::error::Add CLOUDFLARE_API_TOKEN in repository Actions secrets (Account / Cloudflare Pages / Edit for the owning account).'
            exit 1
          fi

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install app dependencies
        working-directory: app
        run: npm ci

      - name: Typecheck
        working-directory: app
        run: npm run check

      - name: Unit tests
        working-directory: app
        run: npm test

      - name: Build the app
        working-directory: app
        run: npm run build

      - name: Package landing and app
        run: node tool/package_site.mjs

      - name: Test the packaging
        run: node --test test/site/hosting.test.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: mantrini-site
          path: build/site
          retention-days: 7

  deploy:
    needs: [build, credentials]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mantrini-site
          path: site
      - name: Deploy exact tested artifact
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: d5e20c6194c7162c0dc8e63be20e3456
          command: pages deploy site --project-name mantrini --branch ${{ github.ref_name }}
