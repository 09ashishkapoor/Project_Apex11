name: Build and deploy Mantrini

on:
  push:
    branches: [main, codex/mantrini-search-landing]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mantrini-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Generate database code
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Analyze Flutter source
        run: flutter analyze
      - name: Test app and web hosting
        run: |
          flutter test
          node --test test/site/hosting.test.mjs
      - name: Verify Android debug build
        run: flutter build apk --debug
      - name: Build Flutter web app
        run: flutter build web --release --no-web-resources-cdn
      - name: Package landing and app
        run: node tool/package_site.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: mantrini-site
          path: build/site
          retention-days: 7

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mantrini-site
          path: site
      - name: Check deployment credential
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo '::error::Add CLOUDFLARE_API_TOKEN in repository Actions secrets (Account / Cloudflare Pages / Edit for the owning account).'
            exit 1
          fi
      - name: Deploy exact tested artifact
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: d5e20c6194c7162c0dc8e63be20e3456
          command: pages deploy site --project-name mantrini --branch ${{ github.ref_name }}
