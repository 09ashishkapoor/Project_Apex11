name: Build MANTRINI app (web + APK)

# Builds the Direction 02 PWA in app/ and wraps the same build in the Android
# shell, so the browser app and the APK can never drift apart.
#
# This workflow is independent of the existing Flutter workflows: it only runs
# when something under app/ changes, and it does not deploy anywhere unless
# explicitly dispatched with deploy=true.

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Also publish the web build to GitHub Pages (gh-pages branch)'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/app-pwa.yml'
  pull_request:
    paths:
      - 'app/**'
      - '.github/workflows/app-pwa.yml'

permissions:
  contents: read

concurrency:
  group: mantrini-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web build, types and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Report bundle size
        run: |
          echo "### Bundle" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          du -sh dist >> "$GITHUB_STEP_SUMMARY"
          find dist/assets -type f -printf '%10s  %p\n' | sort -n >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: mantrini-web
          path: app/dist
          retention-days: 14

      - name: Zip the web build for manual hosting
        run: |
          cd dist
          zip -qr ../mantrini-web.zip .
          cd ..
          echo "zip $(du -h mantrini-web.zip | cut -f1)"

      - uses: actions/upload-artifact@v4
        with:
          name: mantrini-web-zip
          path: app/mantrini-web.zip
          retention-days: 30

  apk:
    name: Android APK (Capacitor)
    runs-on: ubuntu-latest
    needs: web
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Sync into the Android shell
        run: npx cap sync android

      - name: Assemble debug APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p artifacts
          find android/app/build/outputs/apk -name '*.apk' -exec cp {} artifacts/mantrini-debug.apk \;
          ls -lh artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: mantrini-apk-debug
          path: app/artifacts/mantrini-debug.apk
          retention-days: 30

  release-apk:
    name: Android release APK (signed)
    runs-on: ubuntu-latest
    needs: web
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Stop if no signing secret is configured
        if: env.KEYSTORE_BASE64 == ''
        run: |
          echo "::error::ANDROID_KEYSTORE_BASE64 is not set. Add the release keystore and the"
          echo "::error::store/key passwords as repository secrets before building a release APK."
          exit 1

      - name: Install
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Sync into the Android shell
        run: npx cap sync android

      - name: Restore keystore
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/release.keystore
          cat > android/key.properties <<EOF
          storeFile=../release.keystore
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Assemble release APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p artifacts
          find android/app/build/outputs/apk/release -name '*.apk' -exec cp {} artifacts/app-release.apk \;
          ls -lh artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: mantrini-apk-release
          path: app/artifacts/app-release.apk
          retention-days: 90
