name: Validate web hosting

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'docs/**'
      - 'hosting/**'
      - 'tool/package_site.mjs'
      - 'test/site/**'
      - 'app/**'
      - '.github/workflows/validate-site.yml'

permissions:
  contents: read

jobs:
  hosting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install app dependencies
        working-directory: app
        run: npm ci
      - name: Build the app
        working-directory: app
        run: npm run build
      - name: Package the site as the deploy job would
        run: node tool/package_site.mjs
      - name: Test the packaging
        run: node --test test/site/hosting.test.mjs
