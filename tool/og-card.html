<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
@font-face{font-family:'Philosopher';font-weight:400;font-display:block;
  src:url('../docs/assets/fonts/philosopher-latin-normal-400.woff2') format('woff2')}
@font-face{font-family:'Philosopher';font-weight:700;font-display:block;
  src:url('../docs/assets/fonts/philosopher-latin-normal-700.woff2') format('woff2')}
@font-face{font-family:'Crimson Text';font-weight:400;font-display:block;
  src:url('../docs/assets/fonts/crimson-text-latin-normal-400.woff2') format('woff2')}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1200px;height:630px;overflow:hidden}
body{
  background:
    radial-gradient(120% 70% at 78% 22%, rgba(139,38,53,.30), transparent 62%),
    radial-gradient(ellipse at top, #2D0F18 0%, #1F0B11 46%, #0D0506 100%);
  color:#F0DCC8;font-family:'Crimson Text',Georgia,serif;
  display:flex;align-items:center;gap:64px;padding:0 76px;
}
.yantra{position:relative;width:400px;flex:0 0 400px;aspect-ratio:280/244}
.yantra::before{content:"";position:absolute;inset:-22%;
  background:radial-gradient(circle, rgba(232,196,104,.22), transparent 66%)}
.yantra svg{position:relative;width:100%;height:100%}
.text{max-width:600px}
.eyebrow{font-size:19px;font-weight:600;letter-spacing:.26em;text-transform:uppercase;color:#C9A962}
h1{font-family:'Philosopher';font-weight:400;font-size:96px;line-height:.92;
   letter-spacing:.05em;text-indent:.05em;color:#FFF8F0;margin-top:14px}
.rule{width:96px;height:2px;margin:26px 0 22px;
  background:linear-gradient(90deg,#C9A962,rgba(201,169,98,0))}
p.lede{font-size:30px;line-height:1.42;color:rgba(240,220,200,.9);max-width:19ch}
p.lede b{font-weight:600;color:#F4E4C1}
.foot{margin-top:34px;font-size:19px;color:rgba(240,220,200,.66);letter-spacing:.02em}
</style>
</head>
<body>
  <div class="yantra">
    <svg viewBox="0 0 280 244" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <clipPath id="tri"><polygon points="140,241 2,3 278,3"/></clipPath>
        <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#F7E3BB"/>
          <stop offset="42%" stop-color="#E8C468"/>
          <stop offset="100%" stop-color="#C0803A"/>
        </linearGradient>
        <radialGradient id="wash" cx="50%" cy="40%" r="64%">
          <stop offset="0%" stop-color="#0D0506" stop-opacity="0"/>
          <stop offset="58%" stop-color="#0D0506" stop-opacity=".1"/>
          <stop offset="100%" stop-color="#0D0506" stop-opacity=".66"/>
        </radialGradient>
      </defs>
      <image href="../docs/assets/altars/adya-mahakali.jpg" clip-path="url(#tri)"
             x="0" y="0" width="280" height="244" preserveAspectRatio="xMidYMin slice"/>
      <g clip-path="url(#tri)"><rect width="280" height="244" fill="url(#wash)"/></g>
      <polygon points="140,241 2,3 278,3" fill="none" stroke="url(#gold)"
               stroke-width="2.4" stroke-linejoin="round"/>
    </svg>
  </div>
  <div class="text">
    <p class="eyebrow">Jai Khyapa Parampara</p>
    <h1>MANTRINI</h1>
    <div class="rule"></div>
    <p class="lede">A respectful, offline japa counter. <b>Four altars, 108 beads.</b></p>
    <p class="foot">Works offline &middot; No account &middot; Nothing leaves your device</p>
  </div>
</body>
</html>
